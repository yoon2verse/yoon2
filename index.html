<style>
/* Layout: one full-screen pixel hall (9:16) letterboxed in wine, menu bottom-right, sheets slide up */
:root{
  --ink:#2a1a20; --wine:#7d1e2c; --ivory:#fbf5ec; --gold:#c9a24a; --blush:#f2b6c3; --line:#e6d6c4;
  --pixel:"DotGothic16","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:#2a1a20;color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:manipulation}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center;pointer-events:none;transition:opacity .8s}
.badge{font-family:var(--pixel);background:rgba(42,26,32,.82);color:var(--ivory);padding:6px 14px;border-radius:999px;font-size:13px;letter-spacing:.06em;border:1px solid rgba(201,162,74,.6)}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:10px;transition:opacity .8s}
.fab button{font-family:var(--pixel);border:2px solid var(--gold);background:var(--wine);color:var(--ivory);border-radius:14px;padding:12px 18px;font-size:16px;cursor:pointer;box-shadow:0 4px 0 #3e0d16}
.fab button:active{transform:translateY(2px);box-shadow:0 2px 0 #3e0d16}
.fab .toggle{width:58px;height:58px;border-radius:50%;padding:0;font-size:24px}
.fab .item{display:none}
.fab.open .item{display:block}
.intro-on .top,.intro-on .fab{opacity:0;pointer-events:none}
.skip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));font-family:var(--pixel);font-size:14px;color:var(--ivory);background:rgba(42,26,32,.7);border:1px solid rgba(201,162,74,.6);border-radius:999px;padding:8px 16px;cursor:pointer}
.card{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(.96);text-align:center;font-family:var(--pixel);color:var(--wine);background:rgba(251,245,236,.94);border:3px solid var(--gold);border-radius:18px;padding:16px 26px 14px;box-shadow:0 6px 0 rgba(62,13,22,.35);opacity:0;transition:opacity .7s,transform .7s;pointer-events:none;white-space:nowrap}
.card.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.card h1{margin:0;font-size:30px;font-weight:400;letter-spacing:.04em}
.card h1 span{color:#d9566b}
.card p{margin:6px 0 0;font-size:15px;color:var(--ink)}
.card .date{margin:0 0 6px;font-size:13px;color:#9a6a3a;letter-spacing:.08em}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sheet{position:fixed;inset:0;background:rgba(20,10,14,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden]{display:none}
.panel{background:var(--ivory);width:100%;max-width:480px;max-height:86%;overflow:auto;border-radius:20px 20px 0 0;border-top:3px solid var(--gold);padding-block:18px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));box-sizing:border-box}
.panel h2{font-family:var(--pixel);font-size:20px;margin:0 0 12px;color:var(--wine);display:flex;justify-content:space-between;align-items:center;text-wrap:balance}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--ink)}
.row{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
label,.lbl{font-size:13px;font-weight:700}
input,textarea{font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%;box-sizing:border-box}
textarea{resize:none;height:70px}
.maker{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:start}
.maker > div{min-width:0}
#preview{width:64px;height:126px;padding:6px 10px;image-rendering:pixelated;background:#efe4d4;border-radius:12px;border:2px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--wine);background:var(--blush)}
.sw{width:28px;height:28px;border-radius:8px;border:2px solid #fff;outline:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--wine)}
.primary{width:100%;font-family:var(--pixel);font-size:17px;background:var(--wine);color:var(--ivory);border:0;border-radius:12px;padding:14px;cursor:pointer;margin-top:4px}
.primary:disabled{opacity:.5}
.note{font-size:12px;color:#7a6168;margin-top:8px;line-height:1.5}
.list{display:flex;flex-direction:column;gap:10px}
.card2{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px}
.card2 canvas{width:40px;height:79px;padding:4px 6px;image-rendering:pixelated;background:#efe4d4;border-radius:8px}
.card2 b{font-family:var(--pixel);font-size:15px;color:var(--wine)}
.card2 p{margin:4px 0 0;font-size:14px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.info dl{display:grid;grid-template-columns:64px 1fr;gap:8px 12px;margin:0;font-size:15px}
.info dt{font-weight:700;color:var(--wine)}
.info dd{margin:0}
.empty{font-size:14px;color:#7a6168;text-align:center;padding:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ivory);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px);box-sizing:border-box;text-align:center}
</style>

  <button class="primary" id="bSave">축하 남기기</button>

</div></div>

<div class="sheet" id="sList" hidden><div class="panel">

const shade=(hex,k)=>{const n=parseInt(hex.slice(1),16),f=v=>Math.max(0,Math.min(255,Math.round(k<0?v*(1+k):v+(255-v)*k)));
  return '#'+((1<<24)|(f(n>>16)<<16)|(f(n>>8&255)<<8)|f(n&255)).toString(16).slice(1)};
const lum=hex=>{const n=parseInt(hex.slice(1),16);return .3*(n>>16)+.59*(n>>8&255)+.11*(n&255)};

/* older saved looks (before the new sprites) still render */
function normLook(L){
  L=L||{};
  const base=L.base||(L.style==='long'||L.style==='bun'?'f':'m');
  const ok=STYLES[base].some(s=>s[0]===L.style);
  const style=ok?L.style:(base==='f'?'long':(L.style==='short'||L.style==='cap'?'short':'part'));
  const t2=TOPTYPES[base].some(s=>s[0]===L.top2)?L.top2:TOPTYPES[base][0][0];
  return{base,style,hair:L.hair||HAIR[0],top2:t2,top:L.top||TOPS[0],legs:L.legs||(base==='f'?'skirt':'pants'),
    bottom:L.bottom||BOTS[0],skin:L.skin||SKIN[0]};
}
function guestPal(L){
  const sk=L.skin,hr=L.hair,tp=L.top,bt=L.bottom,light=lum(tp)>200;
  return{...COUPLE_PAL,S:sk,s:shade(sk,-.07),k:shade(sk,-.42),H:hr,h:shade(hr,.2),j:shade(hr,.38),
    T:tp,t:light?shade(tp,-.06):shade(tp,.2),d:shade(tp,light?-.18:-.25),u:light?'#ffffff':shade(tp,.42),
    C:'#ffffff',X:lum(tp)<90?'#a52a39':'#2f3b57',W:light?'#d8d4e4':'#ffffff',P:bt,p:lum(bt)>200?shade(bt,-.06):shade(bt,.18)};
}
function guestGrid(L){
  const B=SP[L.base],g=Array.from({length:SH},()=>Array(SW).fill('.'));
  const lay=(rows,y0,mode)=>rows.forEach((r,dy)=>{const y=y0+dy;if(y<0||y>=SH)return;
    for(let x=0;x<SW;x++){const c=r[x];if(c==='.')continue;const d=g[y][x];
      if(mode==='hair'&&c==='O'&&d!=='.'&&d!=='k')continue;
      if(mode==='head'&&c==='k'&&d==='S'){g[y][x]='s';continue}
      g[y][x]=c}});
  const top=B.top[L.top2],bot=B.bottom[L.legs],hair=B.hair[L.style];
  if(L.base==='m'){lay(B.head,0);lay(hair,0,'hair');lay(top,B.topY);lay(bot,B.bottomY)}
  else{lay(top,B.topY);lay(bot,B.bottomY);lay(B.head,0,'head');lay(hair,0,'hair')}
  return g.map(r=>r.join(''));
}
function gridCanvas(rows,pal){
  const c=document.createElement('canvas');c.width=rows[0].length;c.height=rows.length;const g=c.getContext('2d');
  rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const ch=r[x];if(ch==='.')continue;g.fillStyle=pal[ch]||'#f0f';g.fillRect(x,y,1,1)}});
  return c;
}
const spriteCache=new Map();
function spriteOf(who){
  // who: 'groom' | 'bride' | look object
  const key=typeof who==='string'?who:JSON.stringify(who);
  let s=spriteCache.get(key);if(s)return s;
  if(who==='groom')s={cv:gridCanvas(SP.groom,COUPLE_PAL),leg:53,kind:'legs'};
  else if(who==='bride')s={cv:gridCanvas(SP.bride,COUPLE_PAL),leg:56,kind:'gown',axis:19};
  else{const L=normLook(who);s={cv:gridCanvas(guestGrid(L),guestPal(L)),leg:L.legs==='skirt'?57:53,kind:'legs'}}
  s.w=s.cv.width;s.h=s.cv.height;s.axis=s.axis||16;spriteCache.set(key,s);return s;
}
/* frame 0/2 stand, 1 = left foot up + bob, 3 = right foot up + bob (gown: hem sways instead) */
function drawSprite(g,s,x,y,frame){
  const cv=s.cv,w=s.w,h=s.h,L=s.leg;
  if(!(frame&1)){g.drawImage(cv,x,y);return}
  g.drawImage(cv,0,0,w,L,x,y-1,w,L);
  if(s.kind==='gown'){const dx=frame===1?-1:1;g.drawImage(cv,0,L-1,w,h-L+1,x+dx,y+L-1,w,h-L+1);return}
  const m=s.axis,lift=frame===1;
  g.drawImage(cv,0,L-1,m,h-L+1,x,y+L-1-(lift?2:0),m,h-L+1);
  g.drawImage(cv,m,L-1,w-m,h-L+1,x+m,y+L-1-(lift?0:2),w-m,h-L+1);
}

// doors are drawn every frame so they can swing open
function drawDoors(g,p){
  const P=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
  P(DOOR_X-8,DOOR_Y-8,DOOR_W+16,DOOR_B-DOOR_Y+8,'#c9a24a');P(DOOR_X-4,DOOR_Y-12,DOOR_W+8,6,'#c9a24a');
  P(DOOR_X,DOOR_Y,DOOR_W,DOOR_B-DOOR_Y,'#fff4d6');P(DOOR_X+8,DOOR_Y+8,DOOR_W-16,DOOR_B-DOOR_Y-8,'#fffaf0');
  const half=DOOR_W/2,w=Math.round(half*(1-p));
  if(w<=0)return;
  [[DOOR_X,1],[DOOR_X+DOOR_W-w,-1]].forEach(([x,side])=>{
    P(x,DOOR_Y,w,DOOR_B-DOOR_Y,'#8a5a3c');
    if(w>8){P(x+4,DOOR_Y+6,w-8,30,'#9c6a48');P(x+4,DOOR_Y+42,w-8,38,'#9c6a48');}
    P(side>0?x+w-2:x,DOOR_Y,2,DOOR_B-DOOR_Y,'#5e3b26');
    if(w>6)P(side>0?x+w-6:x+3,DOOR_Y+46,3,6,'#c9a24a');
  });
}

/* ---------- people ---------- */
const NAMES=['지훈','수빈','태윤','하은','도현','예린','준서','민지','현우','유나','동건','소희','재민','다은'];
const MSGS=['결혼 축하해!!','행복하게 잘 살아~','축하합니다 🎉','오늘 너무 예쁘다','둘이 잘 어울려요','신혼여행 사진 꼭 보여줘','평생 행복하세요','축하축하!!'];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function randomLook(){
  const base=Math.random()<.5?'m':'f';
  return{base,style:rnd(STYLES[base])[0],hair:Math.random()<.6?HAIR[0]:rnd(HAIR),top2:rnd(TOPTYPES[base])[0],top:rnd(TOPS),
    legs:base==='f'&&Math.random()<.7?'skirt':'pants',bottom:rnd(BOTS),skin:rnd(SKIN)};
}
const seats=[];ROWS.forEach(ry=>COLS.forEach(cx=>seats.push({x:cx,y:ry,used:false})));
function takeSeat(){const free=seats.filter(s=>!s.used);if(!free.length)return null;const s=rnd(free);s.used=true;return s}
function walker(entry,demo){
  const s=takeSeat();
  return{...entry,demo,x:s?s.x:Math.random()*320,y:s?s.y:140+Math.random()*340,tx:0,ty:0,wait:60+Math.random()*400,t:0,bubble:0,clap:0};
}
const couple=[
  {name:'민준',who:'groom',x:148,y:57,fx:148,fy:494,demo:true},
  {name:'서연',who:'bride',x:177,y:56,fx:177,fy:493,demo:true},
];
let demo=NAMES.map(n=>walker({name:n,msg:rnd(MSGS),look:randomLook()},true));
let real=[];
const walkers=()=>real.length?real.concat(demo.slice(0,Math.max(0,12-real.length))):demo;

function tick(w){
  if(w.wait>0){w.wait--;w.moving=false;if(!w.bubble&&Math.random()<0.0012)w.bubble=220;return}
  if(!w.tx){w.tx=4+Math.random()*322;w.ty=136+Math.random()*350;}
  const dx=w.tx-w.x,dy=w.ty-w.y,d=Math.hypot(dx,dy);
  if(d<1){w.tx=0;w.wait=80+Math.random()*300;w.moving=false;return}
  w.x+=dx/d*0.45;w.y+=dy/d*0.45;w.t++;w.moving=true;
}

/* ---------- intro: doors open, the couple walks down the aisle ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const T_DOOR=700,T_OPEN=1500,T_WALK=8200,T_CARD=600;
let intro={on:!reduce,t0:performance.now(),arrived:reduce,done:reduce};
const hearts=[];
function finishIntro(){
  if(intro.done)return;
  intro.done=true;intro.on=false;intro.arrived=true;
  couple.forEach(c=>{c.x=c.fx;c.y=c.fy;c.moving=false});walkers().forEach(w=>w.clap=0);
  document.body.classList.remove('intro-on');$('bSkip').remove();
  $('card').classList.add('show');setTimeout(()=>$('card').classList.remove('show'),2600);
  setTimeout(()=>toast('☰ 메뉴에서 캐릭터를 만들어 축하를 남겨 주세요'),3000);
  for(let i=0;i<14;i++)hearts.push({x:196+(Math.random()-.5)*50,y:500+Math.random()*20,v:.35+Math.random()*.5,life:140+Math.random()*80,p:Math.random()*6});
}
function introStep(now){
  const t=now-intro.t0;
  const door=Math.max(0,Math.min(1,(t-T_DOOR)/(T_OPEN-T_DOOR)));
  const k=Math.max(0,Math.min(1,(t-T_OPEN)/T_WALK));
  couple.forEach(c=>{c.y=Math.round(c.fy-(c.fy-(c.who==='groom'?57:56))*(1-k));c.moving=k>0&&k<1;c.t=t});
  // guests clap as the couple passes their row
  walkers().forEach(w=>{w.clap=k>0&&Math.abs(w.y-couple[0].y)<90?((t/180|0)+(w.x|0))%2:0});
  if(k>=1&&!intro.arrived){intro.arrived=true;setTimeout(finishIntro,T_CARD)}
  return door;
}

/* ---------- render ---------- */
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
const scene=document.createElement('canvas');scene.width=VW;scene.height=VH;const sg=scene.getContext('2d');
let S=1,OX=0,OY=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,3);
  const w=cv.clientWidth,h=cv.clientHeight;cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);
  // whole device pixels per scene pixel keeps every dot the same size
  let dev=Math.floor(Math.min(w*DPR/VW,h*DPR/VH));
  if(dev<1)dev=Math.min(w*DPR/VW,h*DPR/VH);
  S=dev/DPR;
  OX=Math.round((w*DPR-VW*dev)/2)/DPR;OY=Math.round((h*DPR-VH*dev)/2)/DPR;
}
window.addEventListener('resize',resize);resize();
const petals=Array.from({length:70},()=>({x:Math.random()*VW,y:Math.random()*VH,v:.25+Math.random()*.45,p:Math.random()*6}));
const HEART=['.O.O.','OOOOO','OOOOO','.OOO.','..O..'];

function frame(now){
  const list=walkers();
  let door=1;
  if(intro.on)door=introStep(now);
  else if(!reduce)list.forEach(tick);
  sg.drawImage(bg,0,0);drawDoors(sg,door);
  const showCouple=!intro.on||door>.55;   // they step out once the doors are half open
  const people=[...(showCouple?couple:[]).map(c=>({...c,sp:spriteOf(c.who)})),...list.map(w=>({...w,sp:spriteOf(w.look),ref:w}))];
  people.sort((a,b)=>(a.y+a.sp.h)-(b.y+b.sp.h));
  people.forEach(p=>{
    const f=p.moving?((p.who?p.t/160:p.t/9)|0)%4:0;
    drawSprite(sg,p.sp,Math.round(p.x),Math.round(p.y)-(p.clap?1:0),f);
  });
  const petalN=intro.on?70:26;
  if(!reduce)for(let i=0;i<petalN;i++){const p=petals[i];p.y+=p.v;p.p+=.03;if(p.y>VH){p.y=-2;p.x=Math.random()*VW}
    sg.fillStyle=p.p%2>1?'#f7c6d2':'#ffffff';sg.fillRect(Math.round(p.x+Math.sin(p.p)*4),Math.round(p.y),2,2);}
  for(let i=hearts.length-1;i>=0;i--){const h=hearts[i];h.y-=h.v;h.p+=.05;h.life--;
    if(h.life<=0){hearts.splice(i,1);continue}
    sg.globalAlpha=Math.min(1,h.life/40);sg.fillStyle=i%3?'#e8566b':'#f7a1a8';
    HEART.forEach((r,y)=>{for(let x=0;x<5;x++)if(r[x]==='O')sg.fillRect(Math.round(h.x+Math.sin(h.p)*6)+x,Math.round(h.y)+y,1,1)});
    sg.globalAlpha=1;}

  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#2a1a20';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.drawImage(scene,OX,OY,VW*S,VH*S);
  // name labels
  ctx.textAlign='center';ctx.textBaseline='top';
  const fs=Math.max(10,Math.round(S*9));ctx.font=`${fs}px DotGothic16, "Gowun Dodum", sans-serif`;
  people.forEach(p=>{
    if(intro.on&&!p.who)return;
    const sx=OX+(p.x+p.sp.axis)*S,sy=OY+(p.y+p.sp.h)*S+1;
    ctx.lineWidth=3;ctx.strokeStyle='#2a1a20';ctx.strokeText(p.name,sx,sy);
    ctx.fillStyle=p.who?'#ffd6de':p.demo?'#f4ece0':'#fff3a8';ctx.fillText(p.name,sx,sy);
  });
  list.forEach(w=>{
    if(!w.bubble)return;w.bubble--;
    const t=w.msg.length>14?w.msg.slice(0,14)+'…':w.msg;
    const tw=ctx.measureText(t).width+16,bx=Math.min(Math.max(OX+(w.x+16)*S,tw/2+6),cv.clientWidth-tw/2-6),by=OY+w.y*S-fs-14;
    ctx.fillStyle='#fff';ctx.strokeStyle='#2a1a20';ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(bx-tw/2,by,tw,fs+10,4);ctx.fill();ctx.stroke();
    ctx.fillStyle='#2a1a20';ctx.fillText(t,bx,by+5);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

cv.addEventListener('click',e=>{
  if(intro.on){finishIntro();return}
  const r=cv.getBoundingClientRect(),px=(e.clientX-r.left-OX)/S,py=(e.clientY-r.top-OY)/S;
  const hit=walkers().filter(w=>px>=w.x&&px<=w.x+SW&&py>=w.y&&py<=w.y+SH).sort((a,b)=>b.y-a.y)[0];
  if(hit){hit.bubble=260;hit.wait=Math.max(hit.wait,200);}
});

function chips(el,items,key,swatch){

  items.forEach(it=>{

    b.type='button';b.className=swatch?'sw':'chip';b.setAttribute('aria-pressed',look[key]===v);

  chips($('cBase'),[['m','남자'],['f','여자']],'base');
  chips($('cStyle'),STYLES[look.base],'style');chips($('cHair'),HAIR,'hair',1);
  chips($('cTop2'),TOPTYPES[look.base],'top2');chips($('cTop'),TOPS,'top',1);
  chips($('cLegs'),LEGS,'legs');chips($('cBottom'),BOTS,'bottom',1);chips($('cSkin'),SKIN,'skin',1);
  mini($('preview'),look);
}
function mini(c,L){const g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);g.drawImage(spriteOf(L).cv,0,0)}

function renderList(){
  const q=$('fSearch').value.trim(),el=$('list');el.innerHTML='';
  const items=[...real].sort((a,b)=>(b.ts||0)-(a.ts||0)).filter(w=>!q||w.name.includes(q));
  if(!items.length){el.innerHTML='<div class="empty">'+(q?'검색 결과가 없어요.':'아직 방명록이 없어요. 캐릭터를 만들어 첫 축하를 남겨 보세요. 지금 돌아다니는 하객들은 샘플이에요.')+'</div>';return}
  items.forEach(w=>{
    const card=document.createElement('div');card.className='card2';
    const c=document.createElement('canvas');c.width=SW;c.height=SH;mini(c,w.look);
    const d=document.createElement('div');const b=document.createElement('b');b.textContent=w.name;
    const p=document.createElement('p');p.textContent='"'+w.msg+'"';d.append(b,p);card.append(c,d);el.appendChild(card);
  });
}
$('fSearch').addEventListener('input',renderList);

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}

/* ---------- storage: Supabase (shared) when configured, this device otherwise ---------- */
// ▼ Supabase 프로젝트 만든 뒤 여기 두 줄만 채우면 모든 하객이 방명록을 공유해요 (README 참고)
const SUPABASE_URL='';      // 예: https://abcd1234.supabase.co
const SUPABASE_KEY='';      // Project Settings → API → anon public key
const LS='pw-guests';
const remote=!!(SUPABASE_URL&&SUPABASE_KEY);
const HDR={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
function setReal(arr){
  const old=new Map(real.map(w=>[w.id,w]));
  real.forEach(w=>{if(!arr.some(e=>e.id===w.id))seats.forEach(s=>{if(s.x===w.x&&s.y===w.y)s.used=false})});
  real=arr.map(e=>old.get(e.id)?Object.assign(old.get(e.id),e):walker(e,false));
  if(!$('sList').hidden)renderList();
}
function loadLocal(){try{setReal(JSON.parse(localStorage.getItem(LS)||'[]'))}catch(e){}}
async function loadRemote(){
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/guests?select=id,name,msg,look,ts&order=ts.desc&limit=300',{headers:HDR});
    if(r.ok)setReal((await r.json()).filter(e=>e.name&&e.look));
  }catch(e){}
}
if(remote){loadRemote();setInterval(loadRemote,15000);$('saveNote').textContent='남긴 캐릭터와 메시지는 모든 하객에게 보여요.';}
else{loadLocal();$('saveNote').textContent='아직 서버 연결 전이라 이 기기에만 저장돼요.';}

$('bSave').onclick=async()=>{
  const name=$('fName').value.trim(),msg=$('fMsg').value.trim();
  if(!name||!msg){toast('이름과 축하 메시지를 모두 적어 주세요.');return}
  const L=normLook(look);
  const entry={name:name.slice(0,8),msg:msg.slice(0,60),look:L,ts:Date.now()};
  $('bSave').disabled=true;
  try{
    if(remote){
      const r=await fetch(SUPABASE_URL+'/rest/v1/guests',{method:'POST',headers:{...HDR,Prefer:'return=minimal'},body:JSON.stringify(entry)});
      if(!r.ok)throw new Error(r.status);
      await loadRemote();
    }else{
      let arr=[];try{arr=JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){}
      arr.push({id:'l'+entry.ts,...entry});
      try{localStorage.setItem(LS,JSON.stringify(arr))}catch(e){}
      setReal(arr);
    }
    $('sMake').hidden=true;$('fName').value='';$('fMsg').value='';
    const me=real.find(w=>w.ts===entry.ts);if(me){me.x=96;me.y=440;me.wait=240;me.bubble=260}
    toast('축하를 남겼어요! 예식장에 내 캐릭터가 생겼어요.');
  }catch(e){toast('저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.')}
  finally{$('bSave').disabled=false}
};
})();
</script>
